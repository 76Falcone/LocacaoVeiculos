<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Veículos Cadastrados</title>
  <meta name="description" content="Visualize todos os veículos cadastrados no sistema Novare.">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/listarVeiculos.css">
</head>
<body>

  <div class="dashboard">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-logo">
        <span class="logo">NO<span>VARE</span></span>
      </a>

      <span class="sidebar-label">Gerenciamento</span>

      <nav class="sidebar-nav">
        <a href="listarVeiculos.html" class="active">
          <span class="nav-icon">🚗</span>
          Veículos
        </a>
        <a href="listarUsuarios.html">
          <span class="nav-icon">👥</span>
          Usuários
        </a>

        <span class="sidebar-label" style="padding-left:0; padding-right:0;">Cadastros</span>

        <a href="cadastroVeiculo.html">
          <span class="nav-icon">➕</span>
          Novo Veículo
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="../index.html">
          <span>🚪</span>
          Sair do painel
        </a>
      </div>
    </aside>

    <!-- ─── OVERLAY MOBILE ─── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
          <div class="topbar-breadcrumb">
            <a href="listarVeiculos.html">Painel</a>
            <span class="sep">›</span>
            <span>Veículos</span>
          </div>
        </div>
        <div class="topbar-user">
          <div class="topbar-user-avatar">AD</div>
          <span class="topbar-user-name">Admin</span>
        </div>
      </header>

      <!-- Área de conteúdo -->
      <main class="content-area">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Veículos Cadastrados</h1>
            <p class="page-subtitle" id="resultCount">Carregando...</p>
          </div>
          <a href="cadastroVeiculo.html" class="btn-add">
            <span>＋</span> Novo Veículo
          </a>
        </div>

        <!-- Card da tabela -->
        <div class="card">

          <!-- Barra de busca e filtros -->
          <div class="search-bar">
            <div class="search-input-wrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Buscar por modelo, placa, cor..."
              >
            </div>

            <select class="filter-select" id="filterField">
              <option value="todos">Todos os campos</option>
              <option value="id">ID</option>
              <option value="modelo">Modelo</option>
              <option value="placa">Placa</option>
            </select>

            <select class="filter-select" id="filterDisponibilidade">
              <option value="todos">Disponibilidade</option>
              <option value="disponivel">Disponível</option>
              <option value="indisponivel">Indisponível</option>
            </select>
          </div>

          <!-- Resultado -->
          <p class="result-info" id="resultInfo"></p>

          <!-- Tabela -->
          <div class="data-table-wrap">
            <table class="data-table" id="veiculosTable">
              <thead>
                <tr>
                  <th class="sortable" data-col="id">ID ↕</th>
                  <th class="sortable" data-col="placa">Placa ↕</th>
                  <th class="sortable" data-col="modelo">Modelo ↕</th>
                  <th>Cor</th>
                  <th class="sortable" data-col="valorDiaria">Diária ↕</th>
                  <th>Funcionalidade</th>
                  <th>Disponível</th>
                  <th>Ar Cond.</th>
                  <th>Câmbio</th>
                </tr>
              </thead>
              <tbody id="veiculosBody"></tbody>
            </table>
          </div>

          <!-- Estado vazio -->
          <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-state-icon">🔍</span>
            <p>Nenhum veículo encontrado com esses filtros.</p>
          </div>

        </div>
      </main>

    </div>
  </div>

  <!-- Script -->
  <script src="../js/listarVeiculos.js"></script>
</body>
</html>
