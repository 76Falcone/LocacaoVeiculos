<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Login</title>
  <meta name="description" content="Faça login na sua conta Novare para acessar o sistema de gestão de veículos.">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=2">
  <link rel="stylesheet" href="../css/variables.css?v=2">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

  <!-- Botão Dark Mode Flutuante -->
  <button class="btn-dark-toggle" id="darkToggle" aria-label="Ativar modo escuro" title="Modo escuro" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">🌙</button>

  <!-- ─── CONTAINER PRINCIPAL ─── -->
  <main class="login-container">

    <!-- Lado esquerdo -->
    <aside class="login-brand" aria-hidden="true">
      <div class="login-brand-content">
        
        <h2 class="login-brand-title">Alugue seu<br>carro com<br><em>eficiência.</em></h2>
        <p class="login-brand-sub">Controle completo de veículos, usuários e locações em um único painel.</p>

      <!-- brand-circle -->
      <div class="login-brand-circle login-brand-circle-1"></div>
      <div class="login-brand-circle login-brand-circle-2"></div>
    </aside>

    <!-- Lado direito: formulário de login -->
    <section class="login-form-section">
      <div class="login-form-wrap">

        <a href="../index.html" class="login-logo-mobile">
          <span class="logo">NO<span>VARE</span></span>
        </a>

        <!-- Cabeçalho -->
        <h1 class="login-title">Bem-vindo de volta</h1>
        <p class="login-subtitle">Acesse sua conta para continuar.</p>

        <!-- Formulário -->
        <form id="loginForm" action="ControleUsuario" method="post" novalidate>
          <input type="hidden" name="op" value="LOGIN">

          <div class="form-group" id="emailGroup">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@exemplo.com"
                autocomplete="email"
                required
              >
            </div>
            <span class="form-error" id="emailError"></span>
          </div>

          <div class="form-group" id="senhaGroup">
            <label for="senha">Senha</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Sua senha"
                autocomplete="current-password"
                required
              >
              <button type="button" class="toggle-password" id="toggleSenha" aria-label="Mostrar senha">
                👁️
              </button>
            </div>
            <span class="form-error" id="senhaError"></span>
          </div>

          <button type="submit" class="btn-submit" id="btnLogin">
            <span class="btn-text">Entrar</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <p class="login-link">
          Não tem conta? <a href="cadastroUsuario.html">Cadastre-se</a>
        </p>

        <a href="../index.html" class="login-back">← Voltar ao início</a>
      </div>
    </section>

  </main>

  <script src="../js/darkmode.js?v=2"></script>
  <script src="../js/login.js"></script>
</body>
</html>
