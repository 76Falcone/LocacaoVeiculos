<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Reservar Veículo</title>
  <meta name="description" content="Reserve um veículo no sistema Novare.">

  <!-- Fontes -->
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
    rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/cadastroVeiculo.css">
  <link rel="stylesheet" href="../css/reserva.css">
</head>

<body>

  <div class="standalone-wrapper"
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 2rem;">
    <!-- Área de conteúdo -->
    <main class="content-area">
      <h1 class="page-title">Reservar Veículo</h1>
      <p class="page-subtitle">Preencha os dados da locação para confirmar a reserva.</p>

      <!-- Card de resumo do veículo selecionado -->
      <div class="card reserva-resumo-card" id="resumoVeiculo">
        <div class="resumo-icon">🚗</div>
        <div class="resumo-info">
          <div class="resumo-label">Veículo selecionado</div>
          <div class="resumo-modelo" id="resumoModelo">Carregando...</div>
          <div class="resumo-detalhes" id="resumoDetalhes"></div>
        </div>
        <div class="resumo-preco">
          <div class="resumo-preco-label">Diária</div>
          <div class="resumo-preco-valor" id="resumoDiaria">—</div>
        </div>
      </div>

      <!-- Card do formulário -->
      <div class="card form-card">
        <form id="reservaForm" action="ControleLocacao" method="post" novalidate>
          <input type="hidden" name="op" value="CADASTRAR">

          <!-- Campos ocultos: preenchidos automaticamente via JS (não visíveis ao usuário) -->
          <input type="hidden" id="idUsuario" name="idUsuario">
          <input type="hidden" id="idVeiculo" name="idVeiculo">

          <!-- Linha 1: Data de Retirada e Data de Entrega -->
          <div class="form-row">
            <div class="form-group" id="dataRetiradaGroup">
              <label for="dataRetirada">Data de Retirada</label>
              <div class="input-wrap">
                <input type="date" id="dataRetirada" name="dataRetirada" required>
              </div>
              <span class="form-error" id="dataRetiradaError"></span>
            </div>

            <div class="form-group" id="dataEntregaGroup">
              <label for="dataEntrega">Data de Entrega</label>
              <div class="input-wrap">
                <input type="date" id="dataEntrega" name="dataEntrega" required>
              </div>
              <span class="form-error" id="dataEntregaError"></span>
            </div>
          </div>

          <!-- Linha 2: Quantidade de Dias (calculado automaticamente) e Local de Retirada -->
          <div class="form-row">
            <div class="form-group" id="qtdDiasGroup">
              <label for="qtdDias">Quantidade de Dias</label>
              <div class="input-wrap">
                <input type="number" id="qtdDias" name="qtdDias" placeholder="0" min="1" readonly>
              </div>
              <span class="form-error" id="qtdDiasError"></span>
            </div>

            <div class="form-group" id="localRetiradaGroup">
              <label for="localRetirada">Local de Retirada</label>
              <div class="input-wrap">
                <input type="text" id="localRetirada" name="localRetirada" placeholder="Ex: Aeroporto de Guarulhos"
                  required>
              </div>
              <span class="form-error" id="localRetiradaError"></span>
            </div>
          </div>

          <!-- Linha 3: Seguro -->
          <div class="form-group" id="seguroLocacaoGroup">
            <label for="seguroLocacao">Seguro da Locação (R$)</label>
            <div class="input-wrap">
              <input type="number" id="seguroLocacao" name="seguroLocacao" placeholder="0.00" step="0.01" min="0"
                required>
            </div>
            <span class="form-error" id="seguroLocacaoError"></span>
          </div>

          <!-- Card de resumo do valor total -->
          <div class="reserva-total-card" id="totalCard">
            <div class="total-row">
              <span class="total-label">Diária</span>
              <span class="total-val" id="totalDiaria">R$ 0,00</span>
            </div>
            <div class="total-row">
              <span class="total-label">Nº de dias</span>
              <span class="total-val" id="totalDias">0 dias</span>
            </div>
            <div class="total-row">
              <span class="total-label">Seguro</span>
              <span class="total-val" id="totalSeguro">R$ 0,00</span>
            </div>
            <div class="total-divider"></div>
            <div class="total-row total-final">
              <span class="total-label">Valor Total</span>
              <span class="total-val" id="totalValor">R$ 0,00</span>
            </div>
            <!-- Campo oculto: valorTotal enviado ao backend -->
            <input type="hidden" id="valorTotal" name="valorTotal">
          </div>

          <!-- Botão -->
          <button type="submit" class="btn-submit" id="btnReservar">
            <span class="btn-text">Confirmar Reserva</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>
      </div>
    </main>

  </div>

  <!-- Toast de feedback -->
  <div class="toast" id="toast"></div>

  <!-- Script -->
  <script src="../js/reserva.js"></script>
</body>

</html>
