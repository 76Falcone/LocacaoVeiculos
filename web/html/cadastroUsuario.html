<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Cadastro</title>
  <meta name="description" content="Crie sua conta na Novare para acessar o sistema de gestão de veículos.">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/cadastroUsuario.css">
</head>
<body class="cadastro-page">

  <!-- ─── CONTAINER PRINCIPAL ─── -->
  <main class="cadastro-container">

    <!-- Lado esquerdo: painel decorativo -->
    <aside class="cadastro-brand" aria-hidden="true">
      <div class="cadastro-brand-content">
        <div class="cadastro-brand-badge">
          <span class="cadastro-brand-dot"></span>
          Crie sua conta
        </div>
        <h2 class="cadastro-brand-title">Faça parte da<br><em>Novare.</em></h2>
        <p class="cadastro-brand-sub">Cadastre-se e tenha acesso completo ao sistema de gestão de veículos.</p>


    <!-- Lado direito: formulário de cadastro -->
    <section class="cadastro-form-section">
      <div class="cadastro-form-wrap">

        <!-- Logo (mobile) -->
        <a href="../index.html" class="cadastro-logo-mobile">
          <span class="logo">NO<span>VARE</span></span>
        </a>

        <!-- Cabeçalho -->
        <h1 class="cadastro-title">Criar conta</h1>
        <p class="cadastro-subtitle">Preencha seus dados para se cadastrar.</p>

        <!-- Formulário -->
        <form id="cadastroForm" action="ControleUsuario" method="post" novalidate>
          <input type="hidden" name="op" value="CADASTRAR">

          <!-- Nome Completo -->
          <div class="form-group" id="nomeGroup">
            <label for="nome">Nome Completo</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: João Silva"
                autocomplete="name"
                required
              >
            </div>
            <span class="form-error" id="nomeError"></span>
          </div>

          <!-- CPF e CNH (2 colunas) -->
          <div class="form-row">
            <div class="form-group" id="cpfGroup">
              <label for="cpf">CPF</label>
              <div class="input-wrap">
                <span class="input-icon">📄</span>
                <input
                  type="text"
                  id="cpf"
                  name="cpf"
                  placeholder="000.000.000-00"
                  maxlength="14"
                  required
                >
              </div>
              <span class="form-error" id="cpfError"></span>
            </div>

            <div class="form-group" id="cnhGroup">
              <label for="cnh">CNH</label>
              <div class="input-wrap">
                <span class="input-icon">🪪</span>
                <input
                  type="text"
                  id="cnh"
                  name="cnh"
                  placeholder="00000000000"
                  maxlength="11"
                  required
                >
              </div>
              <span class="form-error" id="cnhError"></span>
            </div>
          </div>

          <!-- E-mail -->
          <div class="form-group" id="emailGroup">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="email@exemplo.com"
                autocomplete="email"
                required
              >
            </div>
            <span class="form-error" id="emailError"></span>
          </div>

          <!-- Senha e Confirmar Senha (2 colunas) -->
          <div class="form-row">
            <div class="form-group" id="senhaGroup">
              <label for="senha">Senha</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  placeholder="Mínimo 6 caracteres"
                  autocomplete="new-password"
                  required
                >
                <button type="button" class="toggle-password" id="toggleSenha" aria-label="Mostrar senha">
                  👁️
                </button>
              </div>
              <span class="form-error" id="senhaError"></span>
              <!-- Indicador de força -->
              <div class="password-strength" id="passwordStrength">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-text" id="strengthText"></span>
              </div>
            </div>

            <div class="form-group" id="confirmSenhaGroup">
              <label for="confirmSenha">Confirmar Senha</label>
              <div class="input-wrap">
                <span class="input-icon">🔒</span>
                <input
                  type="password"
                  id="confirmSenha"
                  placeholder="Repita a senha"
                  autocomplete="new-password"
                  required
                >
                <button type="button" class="toggle-password" id="toggleConfirm" aria-label="Mostrar senha">
                  👁️
                </button>
              </div>
              <span class="form-error" id="confirmSenhaError"></span>
            </div>
          </div>

          <!-- Celular -->
          <div class="form-group" id="celularGroup">
            <label for="celular">Celular</label>
            <div class="input-wrap">
              <span class="input-icon">📱</span>
              <input
                type="tel"
                id="celular"
                name="celular"
                placeholder="(11) 99999-9999"
                maxlength="15"
                required
              >
            </div>
            <span class="form-error" id="celularError"></span>
          </div>

          <!-- Botão de cadastro -->
          <button type="submit" class="btn-submit" id="btnCadastro">
            <span class="btn-text">Cadastrar</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Link para login -->
        <p class="cadastro-link">
          Já tem conta? <a href="login.html">Entrar</a>
        </p>

        <!-- Voltar ao site -->
        <a href="../index.html" class="cadastro-back">← Voltar ao início</a>
      </div>
    </section>

  </main>

  <!-- Script -->
  <script src="../js/cadastroUsuario.js"></script>
</body>
</html>
