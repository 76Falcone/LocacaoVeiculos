<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Usuários Cadastrados</title>
  <meta name="description" content="Visualize todos os usuários cadastrados no sistema Novare.">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/listarUsuarios.css">
</head>
<body>

  <div class="dashboard">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-logo">
        <span class="logo">NO<span>VARE</span></span>
      </a>

      <span class="sidebar-label">Gerenciamento</span>

      <nav class="sidebar-nav">
        <a href="listarVeiculos.html">
          <span class="nav-icon">🚗</span>
          Veículos
        </a>
        <a href="listarUsuarios.html" class="active">
          <span class="nav-icon">👥</span>
          Usuários
        </a>

        <span class="sidebar-label" style="padding-left:0; padding-right:0;">Cadastros</span>

        <a href="cadastroVeiculo.html">
          <span class="nav-icon">➕</span>
          Novo Veículo
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="../index.html">
          <span>🚪</span>
          Sair do painel
        </a>
      </div>
    </aside>

    <!-- ─── OVERLAY MOBILE ─── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
          <div class="topbar-breadcrumb">
            <a href="listarUsuarios.html">Painel</a>
            <span class="sep">›</span>
            <span>Usuários</span>
          </div>
        </div>
        <div class="topbar-user">
          <div class="topbar-user-avatar">AD</div>
          <span class="topbar-user-name">Admin</span>
        </div>
      </header>

      <!-- Área de conteúdo -->
      <main class="content-area">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Usuários Cadastrados</h1>
            <p class="page-subtitle" id="resultCount">Carregando...</p>
          </div>
        </div>

          <!-- Tabela -->
          <div class="data-table-wrap">
            <table class="data-table has-filters" id="usuariosTable">
              <thead>
                <tr>
                  <th class="sortable" data-col="id">ID ↕</th>
                  <th class="sortable" data-col="nome">Nome ↕</th>
                  <th>CPF</th>
                  <th>CNH</th>
                  <th class="sortable" data-col="email">E-mail ↕</th>
                  <th>Celular</th>
                </tr>
                <!-- Linha de filtros por coluna -->
                <tr class="filter-row">
                  <th><input type="text" class="col-filter" id="filterId" placeholder="ID"></th>
                  <th><input type="text" class="col-filter" id="filterNome" placeholder="Nome"></th>
                  <th><input type="text" class="col-filter" id="filterCpf" placeholder="CPF"></th>
                  <th><input type="text" class="col-filter" id="filterCnh" placeholder="CNH"></th>
                  <th><input type="text" class="col-filter" id="filterEmail" placeholder="E-mail"></th>
                  <th><input type="text" class="col-filter" id="filterCelular" placeholder="Celular"></th>
                </tr>
              </thead>
              <tbody id="usuariosBody"></tbody>
            </table>
          </div>

          <!-- Estado vazio -->
          <div class="empty-state" id="emptyState" style="display:none;">
            <span class="empty-state-icon">🔍</span>
            <p>Nenhum usuário encontrado com esses filtros.</p>
          </div>

          <!-- Paginação -->
          <div id="pagination"></div>

      </main>

    </div>
  </div>

  <!-- Script -->
  <script src="../js/listarUsuarios.js"></script>
</body>
</html>
