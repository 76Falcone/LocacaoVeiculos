<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novare | Cadastrar Veículo</title>
  <meta name="description" content="Cadastre um novo veículo no sistema Novare.">

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/cadastroVeiculo.css">
</head>
<body>

  <div class="dashboard">

    <!-- ─── SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="sidebar-logo">
        <span class="logo">NO<span>VARE</span></span>
      </a>

      <span class="sidebar-label">Gerenciamento</span>

      <nav class="sidebar-nav">
        <a href="listarVeiculos.html">
          <span class="nav-icon">🚗</span>
          Veículos
        </a>
        <a href="listarUsuarios.html">
          <span class="nav-icon">👥</span>
          Usuários
        </a>

        <span class="sidebar-label" style="padding-left:0; padding-right:0;">Cadastros</span>

        <a href="cadastroVeiculo.html" class="active">
          <span class="nav-icon">➕</span>
          Novo Veículo
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="../index.html">
          <span>🚪</span>
          Sair do painel
        </a>
      </div>
    </aside>

    <!-- ─── OVERLAY MOBILE ─── -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ─── CONTEÚDO PRINCIPAL ─── -->
    <div class="main-content">

      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
          <div class="topbar-breadcrumb">
            <a href="listarVeiculos.html">Veículos</a>
            <span class="sep">›</span>
            <span>Novo veículo</span>
          </div>
        </div>
        <div class="topbar-user">
          <div class="topbar-user-avatar">AD</div>
          <span class="topbar-user-name">Admin</span>
        </div>
      </header>

      <!-- Área de conteúdo -->
      <main class="content-area">
        <h1 class="page-title">Cadastrar Veículo</h1>
        <p class="page-subtitle">Preencha os dados do novo veículo para adicioná-lo à frota.</p>

        <!-- Card do formulário -->
        <div class="card form-card">
          <form id="veiculoForm" action="ControleVeiculo" method="post" novalidate>
            <input type="hidden" name="op" value="CADASTRAR">

            <!-- Linha 1: Placa e Modelo -->
            <div class="form-row">
              <div class="form-group" id="placaGroup">
                <label for="placa">Placa</label>
                <div class="input-wrap">
                  <input
                    type="text"
                    id="placa"
                    name="placa"
                    placeholder="ABC-1D23"
                    maxlength="8"
                    required
                  >
                </div>
                <span class="form-error" id="placaError"></span>
              </div>

              <div class="form-group" id="modeloGroup">
                <label for="modelo">Modelo</label>
                <div class="input-wrap">
                  <input
                    type="text"
                    id="modelo"
                    name="modelo"
                    placeholder="Ex: Toyota Corolla"
                    required
                  >
                </div>
                <span class="form-error" id="modeloError"></span>
              </div>
            </div>

            <!-- Linha 2: Cor e Valor Diária -->
            <div class="form-row">
              <div class="form-group" id="corGroup">
                <label for="cor">Cor</label>
                <div class="input-wrap">
                  <input
                    type="text"
                    id="cor"
                    name="cor"
                    placeholder="Ex: Preto"
                    required
                  >
                </div>
                <span class="form-error" id="corError"></span>
              </div>

              <div class="form-group" id="valorGroup">
                <label for="valorDiaria">Valor da Diária (R$)</label>
                <div class="input-wrap">
                  <input
                    type="number"
                    id="valorDiaria"
                    name="valorDiaria"
                    placeholder="0.00"
                    step="0.01"
                    min="0"
                    required
                  >
                </div>
                <span class="form-error" id="valorError"></span>
              </div>
            </div>

            <!-- Linha 3: Funcionalidade -->
            <div class="form-group" id="funcionalidadeGroup">
              <label for="funcionalidade">Funcionalidade</label>
              <div class="input-wrap">
                <input
                  type="text"
                  id="funcionalidade"
                  name="funcionalidade"
                  placeholder="Ex: Passeio, Trabalho, Utilitário"
                  required
                >
              </div>
              <span class="form-error" id="funcionalidadeError"></span>
            </div>

            <!-- Linha 4: Disponibilidade e Ar Condicionado -->
            <div class="form-row">
              <div class="form-group" id="disponibilidadeGroup">
                <label for="disponibilidade">Disponibilidade</label>
                <select id="disponibilidade" name="disponibilidade" class="form-select" required>
                  <option value="true">Disponível</option>
                  <option value="false">Indisponível</option>
                </select>
              </div>

              <div class="form-group" id="arCondicionadoGroup">
                <label for="arCondicionado">Ar Condicionado</label>
                <select id="arCondicionado" name="arCondicionado" class="form-select" required>
                  <option value="true">Sim</option>
                  <option value="false">Não</option>
                </select>
              </div>
            </div>

            <!-- Linha 5: Tipo de Câmbio -->
            <div class="form-group" id="tipoCambioGroup">
              <label for="tipoCambio">Tipo de Câmbio</label>
              <select id="tipoCambio" name="tipoCambio" class="form-select" required>
                <option value="">Selecione...</option>
                <option value="Automático">Automático</option>
                <option value="Manual">Manual</option>
              </select>
              <span class="form-error" id="tipoCambioError"></span>
            </div>

            <!-- Botão -->
            <button type="submit" class="btn-submit" id="btnSalvar">
              <span class="btn-text">Salvar Veículo</span>
              <span class="btn-loader" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </main>

    </div>
  </div>

  <!-- Toast de feedback -->
  <div class="toast" id="toast"></div>

  <!-- Script -->
  <script src="../js/cadastroVeiculo.js"></script>
</body>
</html>
